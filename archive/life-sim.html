<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>החיים של נהוראי פרחי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="משחק חיים בעברית: מלווים את נהוראי פרחי מהלידה ועד יום ההולדת ה־90, בוחרים בשבילו בצמתים של החיים, וכל בחירה מצמיחה פרח בגינה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@400;600&family=Suez+One&display=swap">
<style>
/* Layout: one story column floating over a living sky that moves from dawn to dusk as Nehorai ages.
   The HUD sits on top, the story card under it, and the garden of his choices grows along the bottom edge. */
:root {
  --bg: #BFE0FF;
  --ink: #1C1736;
  --ink-2: #5B547A;
  --paper: rgba(255, 255, 255, .84);
  --paper-solid: #FFFFFF;
  --paper-2: rgba(244, 240, 255, .9);
  --line: rgba(64, 44, 140, .15);
  --sun: #FFB320;
  --sun-hi: #FFE08A;
  --sun-deep: #D98700;
  --sun-ink: #2E1C00;
  --sun-soft: rgba(255, 179, 32, .16);
  --sun-glow: rgba(255, 179, 32, .36);
  --focus: #2C5FD9;
  --veil: rgba(10, 8, 30, 0);
  --good: #13804A;
  --bad: #C0283F;
  /* each stat has a fill (meter + its flower) and a text tone */
  --c-joy: #EF4F9E;     --t-joy: #B0216B;      /* רקפת */
  --c-health: #E2333E;  --t-health: #AE1F2A;   /* כלנית */
  --c-wisdom: #3D6FE0;  --t-wisdom: #2450B8;   /* תורמוס */
  --c-money: #E3A600;   --t-money: #845C00;    /* חמנייה */
  --c-friends: #8B4FE0; --t-friends: #6532BD;  /* איריס */
  --shadow: 0 18px 48px rgba(28, 18, 72, .18), 0 2px 6px rgba(28, 18, 72, .08);
  --f-display: "Suez One", "Frank Ruhl Libre", "David", Georgia, serif;
  --f-body: "Fredoka", "Rubik", "Assistant", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Playpen Sans Hebrew", "Fredoka", "Segoe UI", system-ui, sans-serif;
  --ground: 110px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0C26;
    --ink: #F2EFFF;
    --ink-2: #B8B1DA;
    --paper: rgba(22, 18, 46, .84);
    --paper-solid: #1A1636;
    --paper-2: rgba(255, 255, 255, .06);
    --line: rgba(205, 195, 255, .17);
    --sun: #FFC23D;
    --sun-hi: #FFE59A;
    --sun-deep: #C98A10;
    --sun-ink: #2A1A00;
    --sun-soft: rgba(255, 194, 61, .14);
    --sun-glow: rgba(255, 194, 61, .28);
    --focus: #9DB8FF;
    --veil: rgba(8, 6, 24, .42);
    --good: #4ADE80;
    --bad: #FF7088;
    --c-joy: #FF6FB5;     --t-joy: #FF9ACD;
    --c-health: #FF5560;  --t-health: #FF8C93;
    --c-wisdom: #6E98FF;  --t-wisdom: #A3BDFF;
    --c-money: #FFC83A;   --t-money: #FFD772;
    --c-friends: #B07CFF; --t-friends: #CBA8FF;
    --shadow: 0 18px 48px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0C26;
  --ink: #F2EFFF;
  --ink-2: #B8B1DA;
  --paper: rgba(22, 18, 46, .84);
  --paper-solid: #1A1636;
  --paper-2: rgba(255, 255, 255, .06);
  --line: rgba(205, 195, 255, .17);
  --sun: #FFC23D;
  --sun-hi: #FFE59A;
  --sun-deep: #C98A10;
  --sun-ink: #2A1A00;
  --sun-soft: rgba(255, 194, 61, .14);
  --sun-glow: rgba(255, 194, 61, .28);
  --focus: #9DB8FF;
  --veil: rgba(8, 6, 24, .42);
  --good: #4ADE80;
  --bad: #FF7088;
  --c-joy: #FF6FB5;     --t-joy: #FF9ACD;
  --c-health: #FF5560;  --t-health: #FF8C93;
  --c-wisdom: #6E98FF;  --t-wisdom: #A3BDFF;
  --c-money: #FFC83A;   --t-money: #FFD772;
  --c-friends: #B07CFF; --t-friends: #CBA8FF;
  --shadow: 0 18px 48px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1[data-focus]:focus, h2[data-focus]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ico { width: 1em; height: 1em; flex: none; }

#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.veil { position: fixed; inset: 0; background: var(--veil); z-index: 1; pointer-events: none; }

.app {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 38rem;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(var(--ground) + 22px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
}
body.is-title .app { min-height: 100vh; min-height: 100dvh; justify-content: center; }

.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(16px) saturate(1.25);
  backdrop-filter: blur(16px) saturate(1.25);
}

/* ---------- HUD ---------- */
.hud { padding: 12px 14px; display: grid; gap: 10px; }
.hud-top { display: flex; align-items: center; gap: 10px; }
.who { flex: 1; min-width: 0; display: grid; }
.who-name { font: 400 1.15rem/1.15 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-stage { font: 500 .85rem/1.35 var(--f-body); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.age { display: flex; align-items: baseline; gap: 6px; }
.age-label { font: 500 .85rem var(--f-body); color: var(--ink-2); }
.age-num { font: 400 2rem/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: center; }
.icon-btn {
  flex: none;
  width: 40px; height: 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--paper-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.icon-btn .ico { width: 20px; height: 20px; }
.icon-btn:hover { border-color: var(--sun); }
.icon-btn .armed-label { display: none; font: 600 .85rem var(--f-body); white-space: nowrap; }
.icon-btn[data-armed] { width: auto; padding: 0 12px; background: var(--sun-soft); border-color: var(--sun); }
.icon-btn[data-armed] .armed-label { display: inline; }
.life-track { position: relative; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.life-fill {
  position: absolute; inset-block: 0; inset-inline-start: 0; width: 0;
  border-radius: inherit;
  background: linear-gradient(to left, var(--sun), var(--c-joy));
  transition: width .6s ease;
}
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.stat { position: relative; display: grid; gap: 4px; min-width: 0; }
.stat-top { display: flex; align-items: center; gap: 5px; color: var(--t); }
.stat-top .ico { width: 18px; height: 18px; }
.stat-val { font: 600 .95rem/1 var(--f-body); font-variant-numeric: tabular-nums; color: var(--ink); }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c); transition: width .7s cubic-bezier(.2, .8, .2, 1); }
.stat-name { font: 500 .75rem/1.1 var(--f-body); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-delta { position: absolute; inset-inline-end: 0; top: 0; font: 700 .8rem var(--f-body); color: var(--t); opacity: 0; pointer-events: none; }
.stat-delta.show { animation: floatUp 1.4s ease-out forwards; }
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(6px); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-16px); }
}

/* ---------- story card ---------- */
.card { padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.card.enter { animation: rise .34s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { opacity: .25; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.scene-head { display: flex; align-items: center; gap: 14px; }
.head-txt { min-width: 0; }
.art {
  flex: none;
  width: 76px; height: 76px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 42px; line-height: 1;
  background: radial-gradient(circle, var(--sun-glow) 0 36%, var(--sun-soft) 37% 62%, transparent 63%);
}
.kicker { font: 600 .82rem/1.25 var(--f-body); color: var(--ink-2); letter-spacing: .02em; }
.title { margin: 2px 0 0; font: 400 clamp(1.45rem, 1.1rem + 1.6vw, 1.85rem)/1.18 var(--f-display); text-wrap: balance; }
.text { margin: 0; font-size: 1.06rem; line-height: 1.65; max-width: 62ch; }
.hint { margin: 0; font-size: .92rem; line-height: 1.5; color: var(--ink-2); }
.choices { display: grid; gap: 9px; margin: 2px 0 0; padding: 0; list-style: none; }
.choice {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  text-align: start;
  padding: 13px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--paper-2);
  font: 500 1.02rem/1.35 var(--f-body);
  cursor: pointer;
  transition: transform .15s ease, background .15s, border-color .15s;
}
.choice:hover { border-color: var(--sun); background: var(--sun-soft); }
.choice:active { transform: scale(.985); }
.key {
  flex: none;
  width: 28px; height: 28px;
  border-radius: 9px;
  display: grid; place-items: center;
  font: 600 .9rem/1 var(--f-body);
  background: var(--paper-solid);
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.picked { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--sun-soft); font-weight: 500; }
.picked .ico { width: 20px; height: 20px; color: var(--good); }
.result { margin: 0; font-size: 1.1rem; line-height: 1.6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  border-radius: 99px;
  font: 600 .88rem/1 var(--f-body);
  color: var(--t);
  background: color-mix(in srgb, var(--c) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 32%, transparent);
}
.chip .ico { width: 15px; height: 15px; }
.chip.ach-chip { --c: var(--sun); color: var(--ink); }
.chip.ach-chip .ico { color: var(--sun-deep); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 50px;
  padding: 0 22px;
  border-radius: 14px;
  border: 0;
  font: 600 1.05rem/1 var(--f-body);
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, background .15s, border-color .15s;
}
.btn .ico { width: 18px; height: 18px; }
.btn-primary { background: var(--sun); color: var(--sun-ink); box-shadow: 0 5px 0 var(--sun-deep), 0 10px 22px var(--sun-glow); }
.btn-primary:hover { background: var(--sun-hi); }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sun-deep), 0 6px 14px var(--sun-glow); }
.btn-ghost { background: var(--paper-2); border: 1px solid var(--line); }
.btn-ghost:hover { border-color: var(--sun); }
.btn-wide { width: 100%; }

/* ---------- title screen ---------- */
.hero-title { margin: 0; font: 400 clamp(2.1rem, 1.4rem + 3.2vw, 2.9rem)/1.08 var(--f-display); text-wrap: balance; }
.hero-title .hl { text-decoration: underline; text-decoration-color: var(--sun); text-decoration-thickness: .12em; text-underline-offset: .14em; }
.lede { margin: 0; font-size: 1.08rem; line-height: 1.7; max-width: 60ch; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.how li { display: flex; gap: 12px; align-items: baseline; line-height: 1.55; }
.how li::before {
  content: ""; flex: none;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--sun);
  box-shadow: 0 0 0 4px var(--sun-soft);
  transform: translateY(-2px);
}
.legend-wrap { display: grid; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--ink-2); }
.legend-item .ico { width: 18px; height: 18px; color: var(--c); }
.legend-item b { color: var(--ink); font-weight: 600; }
.meta { margin: 0; font-size: .9rem; color: var(--ink-2); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ach { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper-2); }
.medal { grid-row: span 2; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: var(--sun-ink); }
.medal .ico { width: 16px; height: 16px; }
.ach.locked .medal { background: var(--line); color: var(--ink-2); }
.ach-name { font-weight: 600; font-size: .92rem; line-height: 1.2; }
.ach-desc { font-size: .8rem; line-height: 1.3; color: var(--ink-2); }
.ach.locked .ach-name { color: var(--ink-2); }

/* ---------- mini games ---------- */
.mg-status { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mg-status b { color: var(--ink); }
.mem-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mem-card { position: relative; aspect-ratio: 3 / 4; max-width: 100%; padding: 0; border: 0; border-radius: 12px; background: transparent; cursor: pointer; perspective: 600px; }
.mem-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .38s cubic-bezier(.2, .8, .2, 1); }
.mem-card.up .mem-inner, .mem-card.done .mem-inner { transform: rotateY(180deg); }
.mem-back, .mem-front { position: absolute; inset: 0; border-radius: 12px; display: grid; place-items: center; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.mem-back {
  border: 1px solid var(--line);
  background:
    radial-gradient(circle, var(--sun) 0 15%, transparent 16%),
    repeating-conic-gradient(from 0deg, var(--sun-soft) 0 12deg, transparent 12deg 24deg),
    var(--paper-2);
}
.mem-front { transform: rotateY(180deg); background: var(--paper-solid); border: 2px solid var(--sun); font-size: clamp(1.6rem, 6vw, 2.2rem); }
.mem-card.done .mem-front { border-color: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.mem-card:disabled { cursor: default; }

.timer { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.timer > i { display: block; height: 100%; width: 100%; border-radius: inherit; background: var(--sun); }
.timer.low > i { background: var(--bad); }
.quiz { display: grid; gap: 14px; }
.q-eq { font: 400 clamp(2rem, 1.6rem + 2vw, 2.6rem)/1.1 var(--f-display); text-align: center; padding-block: 8px; font-variant-numeric: tabular-nums; }
.q-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.q-opt { min-height: 58px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper-2); font: 600 1.3rem/1 var(--f-body); font-variant-numeric: tabular-nums; cursor: pointer; }
.q-opt:hover:not(:disabled) { border-color: var(--sun); background: var(--sun-soft); }
.q-opt.right { background: color-mix(in srgb, var(--good) 20%, transparent); border-color: var(--good); }
.q-opt.wrong { background: color-mix(in srgb, var(--bad) 18%, transparent); border-color: var(--bad); }

.tap { display: grid; justify-items: center; gap: 12px; padding-block: 4px; }
.tap .timer { width: 100%; }
.tap-count { font: 400 2.6rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tap-count small { font: 500 1rem var(--f-body); color: var(--ink-2); margin-inline-start: 8px; }
.tap-btn {
  width: min(52vw, 180px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%; border: 0;
  font: 600 1.4rem/1 var(--f-body);
  color: var(--sun-ink);
  background: radial-gradient(circle at 50% 38%, var(--sun-hi), var(--sun) 58%, var(--sun-deep));
  box-shadow: 0 8px 0 var(--sun-deep), 0 16px 40px var(--sun-glow);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  transition: transform .06s ease, box-shadow .06s ease;
}
.tap-btn.hit { transform: translateY(4px) scale(.97); box-shadow: 0 4px 0 var(--sun-deep), 0 10px 28px var(--sun-glow); }
.tap-btn:disabled { opacity: .6; cursor: default; }

.tm-track { position: relative; height: 56px; border-radius: 16px; background: var(--paper-2); border: 1px solid var(--line); overflow: hidden; direction: ltr; }
.tm-zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--sun) 35%, transparent); border-inline: 2px solid var(--sun); }
.tm-zone.hit { background: color-mix(in srgb, var(--good) 40%, transparent); border-color: var(--good); }
.tm-needle { position: absolute; top: 6px; bottom: 6px; width: 4px; margin-left: -2px; border-radius: 4px; background: var(--ink); }
.tm-needle.miss { background: var(--bad); }
.tm-marks { display: inline-flex; gap: 8px; }
.tm-mark { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.tm-mark.hit { background: var(--good); }
.tm-mark.miss { background: var(--bad); }

/* ---------- ending ---------- */
.end-sub { margin: 0; font: 500 1.1rem/1.4 var(--f-body); color: var(--ink-2); }
.score-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.score { padding: 10px 12px; border-radius: 14px; background: var(--paper-2); border: 1px solid var(--line); display: grid; gap: 2px; align-content: start; }
.score b { font: 400 1.65rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.score span { font-size: .8rem; line-height: 1.3; color: var(--ink-2); }
.score .best { font-weight: 600; color: var(--t-money); }
.garden-line { margin: 0; font-size: .98rem; line-height: 1.6; color: var(--ink-2); }
.section-label { margin: 4px 0 -4px; font: 600 .88rem var(--f-body); color: var(--ink-2); }
.book { margin: 0; padding: 14px; border-radius: 16px; background: var(--paper-2); border: 1px solid var(--line); list-style: none; display: grid; gap: 8px; font-family: var(--f-hand); }
.book li { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: .95rem; line-height: 1.5; }
.book .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.book .b-age { font-weight: 600; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
#copyBox { display: grid; gap: 6px; }
#copyBox textarea { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper-solid); color: var(--ink); font: 400 .9rem/1.5 var(--f-body); resize: vertical; }

/* ---------- toast ---------- */
.toast {
  position: fixed; z-index: 20;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: 0;
  right: 0;
  margin-inline: auto;
  width: max-content;
  max-width: calc(100% - 32px);
  transform: translateY(-160%);
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  border-radius: 14px;
  background: var(--paper-solid);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  font-weight: 500;
  transition: transform .35s cubic-bezier(.2, .8, .2, 1);
}
.toast.show { transform: none; }
.toast .medal { grid-row: auto; width: 28px; height: 28px; }

@media (max-width: 420px) {

function pickCareers() {
  const f = st.flags;
  const ranked = Object.keys(CAREERS)
    .map(k => ({ k, v: CAREERS[k].fit(f) + Math.random() * 1.5 }))
    .sort((a, b) => b.v - a.v)
    .map(o => o.k);
  const picks = ranked.slice(0, 3), rest = ranked.slice(3);
  picks.push(rest[rnd(rest.length)]);
  return shuffle(picks);
}

/* ---------- storage (per browser, best effort) ---------- */
const STORE_KEY = 'nehorai-parchi-life:v1';
let store = { ach: {}, lives: 0, best: 0, sound: true };
function loadStore() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) { /* storage unavailable */ }

/* ---------- sound: tiny synth, only after a click ---------- */
let actx = null;

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

const sfx = {

  good: () => { tone(660, 0.1, 'triangle', 0.045); tone(990, 0.16, 'triangle', 0.035, 0.07); },
  bad: () => tone(190, 0.22, 'sine', 0.05),
  tap: () => tone(420 + Math.random() * 90, 0.045, 'square', 0.018),
  fanfare: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.04, i * 0.09)),

/* ---------- state ---------- */
const freshState = () => ({
  phase: 'title', view: 'choose', slot: 0, plan: [], age: 0,
  stats: { ...START_STATS }, flags: {}, log: [], flowers: [], used: {},
  cur: null, pending: null, career: null, newAch: [], score: 0, isBest: false,

let st = freshState();
let keyHook = null;   // the running mini game can claim key presses
const val = x => (typeof x === 'function' ? x(st) : x);
const choicesOf = sc => val(sc.choices).filter(c => !c.when || c.when(st));

/* big gains shrink as a stat nears 100, so reaching 90 takes real focus */
function applyFx(fx = {}) {
  const d = {};
  for (const k of Object.keys(fx)) {
    const v0 = st.stats[k], n = fx[k];
    const step = n > 0 ? Math.max(1, Math.round(n * clamp((100 - v0) / 45, 0.15, 1))) : n;
    const v1 = clamp(v0 + step, 0, 100);
    if (v1 !== v0) { d[k] = v1 - v0; st.stats[k] = v1; }
  }

const topGain = d => Object.keys(d).reduce((best, k) => (d[k] > (best ? d[best] : 0) ? k : best), null);

function plant(deltas) {
  const i = st.flowers.length;
  st.flowers.push({
    k: topGain(deltas) || 'joy',
    x: +(0.05 + ((i * 0.618034 + 0.31) % 1) * 0.9).toFixed(4),   // golden-ratio spacing keeps the garden even
    h: +Math.random().toFixed(3),
    s: +(0.88 + Math.random() * 0.3).toFixed(3),
    ph: +(Math.random() * 6.28).toFixed(3),

}
const addLog = (text, deltas) => { if (text) st.log.push({ age: st.age, text, k: topGain(deltas) }); };

function unlock(id, quiet = false) {
  if (!id || !ACH_BY[id] || store.ach[id]) return;
  store.ach[id] = Date.now();
  st.newAch.push(id);
  saveStore();
  if (!quiet) { toast(`הישג חדש: ${ACH_BY[id].name}`, true); sfx.fanfare(); World.burst(18); }
}

/* ---------- flow ---------- */
function startLife() {
  st = freshState();
  st.phase = 'play';
  st.plan = PATH.filter(p => !p.event || Math.random() < 0.6).map(p => ({ ...p }));
  document.body.classList.remove('is-title');
  World.setParty(false);
  World.setFlowers(st.flowers);
  enterSlot();
}
function next() { st.slot++; enterSlot(); }

function enterSlot() {
  const slot = st.plan[st.slot];
  if (!slot || slot.id === 'ending') return showEnding();
  setAge(slot.age ?? SCENES[slot.id].age);
  if (slot.event) {
    const pool = EVENTS.filter(e => st.age >= e.min && st.age <= e.max && !st.used[e.id]);
    if (!pool.length) return next();
    return showEvent(pool[rnd(pool.length)]);
  }
  let id = slot.id;
  if (slot.pool) {
    const ids = POOLS[slot.pool].filter(x => !st.used[x] && (!SCENES[x].when || SCENES[x].when(st)));
    if (!ids.length) return next();
    id = ids[rnd(ids.length)];
  }
  st.used[id] = true;
  st.cur = { id };
  st.view = SCENES[id].mini ? 'mini' : 'choose';
  render();
}

function choose(i) {
  if (st.view !== 'choose') return;
  const sc = SCENES[st.cur.id];
  const c = choicesOf(sc)[i];
  if (!c) return;
  sfx.click();
  const r = c.chance != null && Math.random() >= c.chance ? { ...c, ach: null, ...c.fail } : c;
  // text is read before the choice's flags land, so echoes refer to the past
  resolve({ title: val(sc.title), art: val(sc.art), choice: val(c.label), out: val(r.out), log: val(r.log), fx: r.fx, set: r.set, ach: val(r.ach), after: r.after });

function resolve(o) {

  if (o.after) o.after(st);
  const deltas = applyFx(o.fx);
  plant(deltas);
  addLog(o.log, deltas);
  st.view = 'outcome';
  st.pending = { art: o.art, kicker: kickerFor(st.age), title: o.title, choice: o.choice, out: o.out, deltas };
  renderHud(deltas);
  renderOutcome();

}

  const deltas = applyFx(ev.fx);
  const out = val(ev.text);
  addLog(val(ev.log), deltas);
  st.cur = { event: ev.id };
  st.view = 'outcome';
  st.pending = { art: ev.art, kicker: `גיל ${st.age} · הפתעה`, title: ev.title, choice: null, out, deltas };
  renderHud(deltas);
  renderOutcome();
  $('#live').textContent = out;
}

function showEnding() {
  st.phase = 'end';
  st.view = 'end';
  st.slot = st.plan.length - 1;
  setAge(90);
  const s = st.stats;
  st.score = STATS.reduce((sum, x) => sum + s[x.k], 0);
  store.lives = (store.lives || 0) + 1;
  st.isBest = st.score > (store.best || 0);
  if (st.isBest) store.best = st.score;
  unlock('first', true);
  if (store.lives >= 3) unlock('three', true);
  for (const x of STATS) if (s[x.k] >= 90) unlock(END_ACH[x.k], true);
  if (STATS.every(x => s[x.k] >= 70)) unlock('balance', true);
  saveStore();
  World.setParty(true);
  World.burst();
  sfx.fanfare();
  renderHud();

function gardenLine() {

  if (parts.length === 1) return `בגינה צמחו ${parts[0]}.`;
  const lastPart = parts.pop();
  return `בגינה צמחו ${parts.join(', ')} ${/^\d/.test(lastPart) ? 'ו־' : 'ו'}${lastPart}.`;
}

/* ---------- mini games: each paints the card and calls done(result) ---------- */

    keyHook = e => { if (e.key === ' ' || e.key === 'Enter') { if (!e.repeat) hit(); return true; } return false; };
  },

  timing(sc, done) {
    const cfg = moment();
    const rounds = [{ w: 24, v: 0.75 }, { w: 18, v: 1 }, { w: 13, v: 1.3 }];   // zone width in %, needle speed in tracks per second
    paint(`${headHTML(cfg.art, kickerFor(st.age), cfg.title, false)}
      <p class="text">${esc(cfg.intro)}</p>
      <p class="hint">לוחצים "עכשיו!" (או רווח) כשהמחוג בתוך האזור המואר. שלושה סבבים, וכל סבב מהיר יותר.</p>
      <div class="mg-status"><span id="tmRound">סבב 1 מתוך 3</span><span class="tm-marks">${'<i class="tm-mark"></i>'.repeat(3)}</span></div>
      <div class="tm-track"><div class="tm-zone" id="tmZone"></div><div class="tm-needle" id="tmNeedle"></div></div>
      <button class="btn btn-primary btn-wide" type="button" id="tmBtn" data-focus>עכשיו!</button>`);
    const zoneEl = $('#tmZone'), needle = $('#tmNeedle'), marks = [...card.querySelectorAll('.tm-mark')];
    let r = 0, hits = 0, pos = 0, dir = 1, zone = 0, paused = true, over = false, last = 0;
    const setup = () => {
      const w = rounds[r].w;
      zone = 6 + Math.random() * (88 - w);
      zoneEl.style.left = zone + '%';
      zoneEl.style.width = w + '%';
      zoneEl.classList.remove('hit');
      needle.classList.remove('miss');
      pos = Math.random() < 0.5 ? 0 : 100;
      dir = pos === 0 ? 1 : -1;
      $('#tmRound').textContent = `סבב ${r + 1} מתוך 3`;
      last = performance.now();
      paused = false;
    };
    const loop = now => {
      if (over || !needle.isConnected) return;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!paused) {
        pos += dir * rounds[r].v * 100 * dt;
        if (pos >= 100) { pos = 100; dir = -1; } else if (pos <= 0) { pos = 0; dir = 1; }
        needle.style.left = pos + '%';
      }
      requestAnimationFrame(loop);
    };
    const press = () => {
      if (paused || over) return;
      paused = true;
      const ok = pos >= zone && pos <= zone + rounds[r].w;
      marks[r].classList.add(ok ? 'hit' : 'miss');
      if (ok) { hits++; zoneEl.classList.add('hit'); sfx.good(); } else { needle.classList.add('miss'); sfx.bad(); }
      r++;
      setTimeout(() => {
        if (r < rounds.length) return setup();
        over = true; keyHook = null;
        done(timingResult(hits, cfg));
      }, 750);
    };
    $('#tmBtn').addEventListener('click', press);
    keyHook = e => { if (e.key === ' ') { if (!e.repeat) press(); return true; } return false; };
    setup();
    requestAnimationFrame(loop);
  },
};

function makeQuestion() {
  const type = rnd(3);
  let a, b, ans, op;
  if (type === 0) { a = 12 + rnd(78); b = 11 + rnd(49); ans = a + b; op = '+'; }
  else if (type === 1) { a = 40 + rnd(81); b = 11 + rnd(a - 15); ans = a - b; op = '−'; }
  else { a = 3 + rnd(10); b = 3 + rnd(10); ans = a * b; op = '×'; }
  const set = new Set([ans]);
  while (set.size < 3) {
    const delta = type === 2 ? (rnd(2) ? a : b) * (rnd(2) ? 1 : -1) + rnd(3) - 1 : (1 + rnd(10)) * (rnd(2) ? 1 : -1);
    if (ans + delta > 0) set.add(ans + delta);
  }
  return { a, b, op, ans, opts: shuffle([...set]) };
}
const memoryResult = m => (m <= 10
  ? { fx: { wisdom: 12, joy: 5 }, out: `רק ${m} מהלכים! נהוראי מקבל שתי מדבקות כוכב, והמורה תולה את הדף שלו על הלוח.`, log: `מצא את כל הזוגות ב־${m} מהלכים בלבד`, ach: 'memory' }
  : m <= 14

    : { fx: { wisdom: 5, joy: 3 }, out: `זה לקח ${m} מהלכים, אבל נהוראי לא ויתר. גם התמדה היא כישרון.`, log: 'התעקש וסיים את משחק הזיכרון' });
function quizResult(r) {

  if (r === 3) return { fx: { wisdom: 7, joy: 3 }, out: '80, ציון טוב מאוד. חוגגים עם פיצה.', log: 'קיבל 80 בבגרות במתמטיקה' };
  return { fx: { wisdom: 4, joy: -1 }, out: `${g}. לא הציון שחלם עליו, אבל יש מועד ב׳, והוא לומד מזה המון.`, log: `קיבל ${g} בבגרות, ולמד לא לוותר` };
}

function timingResult(h, cfg) {

}

let ageAnim = 0;
function setAge(age) {
  const from = st.age;
  st.age = age;
  World.setTime(ageToT(age));
  const el = $('#ageNum');
  cancelAnimationFrame(ageAnim);
  if (reduce || age <= from) el.textContent = age;
  else {
    const t0 = performance.now(), dur = clamp((age - from) * 60, 250, 900);
    const stepAge = now => {
      const k = clamp((now - t0) / dur, 0, 1);
      el.textContent = Math.round(from + (age - from) * easeOut(k));
      if (k < 1) ageAnim = requestAnimationFrame(stepAge);
    };
    ageAnim = requestAnimationFrame(stepAge);
  }
  renderHud(st.phase === 'play' ? ageDrift(from, age) : {});
}

/* time passes: happiness and friendships fade a little unless tended, and after 45 health needs more care */
function ageDrift(from, to) {
  const years = to - from, d = {};
  if (years <= 0) return d;
  const pull = (k, toward, rate) => {
    const v = st.stats[k];
    const n = v > toward ? Math.round((v - toward) * (1 - Math.pow(1 - rate, years))) : 0;
    if (n > 0) { st.stats[k] = v - n; d[k] = -n; }
  };
  pull('joy', 55, 0.012);
  pull('friends', 50, 0.006);
  const older = to > 45 ? Math.min(st.stats.health, Math.round((to - Math.max(from, 45)) / 5)) : 0;
  if (older > 0) { st.stats.health -= older; d.health = -older; }
  return d;
}

    <p class="result">${esc(p.out)}</p>
    ${chipsHTML(p.deltas)}
    <div class="actions"><button class="btn btn-primary btn-wide" type="button" data-act="next" data-focus>המשך <span aria-hidden="true">←</span></button></div>`);
}

function startMini() {
  const sc = SCENES[st.cur.id];
  st.view = 'mini';
  MINI[sc.mini](sc, res => resolve({ title: val(sc.title), art: val(sc.art), choice: null, ...res }));
}

function renderEnding() {
  const e = endingOf();
  const garden = gardenLine();
  paint(`${headHTML('🎂', 'גיל 90 · מסיבת יום ההולדת בגינה', e.title)}
    <p class="end-sub">${esc(e.sub)}</p>
    <p class="text">${esc(e.story)}</p>
    <div class="score-row">
      <div class="score"><b>${st.score}</b><span>ציון החיים מתוך 500</span>${st.isBest ? '<span class="best">שיא חדש!</span>' : ''}</div>
      <div class="score"><b>${st.flowers.length}</b><span>פרחים בגינה</span></div>
      <div class="score"><b>${st.log.length}</b><span>פרקים בספר החיים</span></div>
    </div>
    ${garden ? `<p class="garden-line">${esc(garden)}</p>` : ''}
    ${st.newAch.length ? `<div class="section-label">הישגים חדשים</div><div class="chips">${st.newAch.map(id => `<span class="chip ach-chip">${icon('i-star')}${ACH_BY[id].name}</span>`).join('')}</div>` : ''}
    <div class="section-label">ספר החיים</div>
    <ol class="book">${st.log.map(l => `<li style="${l.k ? statVars(l.k) : '--c:var(--line)'}"><span class="dot" aria-hidden="true"></span><span class="b-age">גיל ${l.age}</span><span>${esc(l.text)}</span></li>`).join('')}</ol>
    <div class="actions">
      <button class="btn btn-primary" type="button" data-act="again">לחיות שוב <span aria-hidden="true">↺</span></button>
      <button class="btn btn-ghost" type="button" data-act="copy">להעתיק את סיפור החיים</button>
    </div>
    <div id="copyBox" hidden></div>`);
}

function storyText() {
  const e = endingOf();
  return [
    'החיים של נהוראי פרחי',
    `${e.title} · ${e.sub}`,
    `ציון החיים: ${st.score} מתוך 500`,
    gardenLine(),
    '',
    'ספר החיים:',
    ...st.log.map(l => `גיל ${l.age} · ${l.text}`),
  ].join('\n');
}
function copyStory() {
  const text = storyText();
  const fallback = () => {
    const box = $('#copyBox');
    box.hidden = false;
    box.innerHTML = '<label class="hint" for="copyArea">הדפדפן לא אישר העתקה אוטומטית. הטקסט מסומן, ואפשר להעתיק אותו ידנית.</label><textarea id="copyArea" rows="8" readonly></textarea>';
    const ta = $('#copyArea');
    ta.value = text;
    ta.focus();
    ta.select();
  };
  try { navigator.clipboard.writeText(text).then(() => toast('הסיפור הועתק'), fallback); } catch (e) { fallback(); }
}

/* ---------- toasts ---------- */
const toastEl = $('#toast');
const toastQueue = [];
let toastBusy = false;
function toast(msg, medal = false) { toastQueue.push({ msg, medal }); if (!toastBusy) nextToast(); }
function nextToast() {
  const item = toastQueue.shift();
  if (!item) { toastBusy = false; return; }
  toastBusy = true;
  toastEl.innerHTML = `${item.medal ? `<span class="medal">${icon('i-star')}</span>` : ''}<span>${esc(item.msg)}</span>`;
  toastEl.classList.add('show');
  setTimeout(() => { toastEl.classList.remove('show'); setTimeout(() => { toastEl.textContent = ''; nextToast(); }, 380); }, 2400);
}

function syncSound() {
  const b = $('#soundBtn');
  b.setAttribute('aria-pressed', String(!!store.sound));
  b.innerHTML = icon(store.sound ? 'i-sound' : 'i-mute');
}
function goTitle() {
  st = freshState();
  World.setParty(false);
  World.jump(0.03);
  World.setFlowers(PREVIEW);
  renderHud();
  renderTitle(true);
}
const PREVIEW = STATS.map((s, i) => ({ k: s.k, x: 0.14 + i * 0.18, h: i % 2 ? 0.85 : 0.45, s: 1, ph: i * 1.3, row: 0, born: -1e9 }));

/* ---------- input ---------- */
card.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'start' || act === 'again') { sfx.click(); startLife(); }
  else if (act === 'choose') choose(+b.dataset.i);
  else if (act === 'next') { sfx.click(); next(); }
  else if (act === 'copy') copyStory();
  else if (act === 'toggle-ach') {
    const panel = $('#achPanel');
    panel.hidden = !panel.hidden;
    b.setAttribute('aria-expanded', String(!panel.hidden));
  }
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('textarea, input')) return;
  if (keyHook && keyHook(e)) { e.preventDefault(); return; }
  if (st.phase === 'play' && st.view === 'choose' && /^[1-4]$/.test(e.key)) {
    const b = card.querySelector(`[data-act="choose"][data-i="${+e.key - 1}"]`);
    if (b) { e.preventDefault(); b.click(); }
  }
});
$('#soundBtn').addEventListener('click', () => { store.sound = !store.sound; saveStore(); syncSound(); sfx.click(); });
const restartBtn = $('#restartBtn');
let disarm = 0;
restartBtn.addEventListener('click', () => {
  if (restartBtn.dataset.armed) {
    delete restartBtn.dataset.armed;
    clearTimeout(disarm);
    goTitle();
    return;
  }
  restartBtn.dataset.armed = '1';
  restartBtn.setAttribute('aria-label', 'ללחוץ שוב כדי לחזור למסך הפתיחה');
  disarm = setTimeout(() => { delete restartBtn.dataset.armed; restartBtn.setAttribute('aria-label', 'להתחיל מחדש'); }, 3000);
});
motionQuery.addEventListener?.('change', e => { reduce = e.matches; World.motionChanged(); });

/* ---------- boot (keeps a game in progress across a live page update) ---------- */
function boot(data) {
  loadStore();
  World.init();
  buildHud();
  const saved = data && data.st;
  if (saved && saved.phase && saved.phase !== 'title') {
    st = saved;
    for (const f of st.flowers) f.born = -1e9;
    document.body.classList.remove('is-title');
    World.jump(ageToT(st.age));
    World.setFlowers(st.flowers);
    World.setParty(st.phase === 'end');
    $('#ageNum').textContent = st.age;
    renderHud();
    render();
  } else {
    World.setFlowers(PREVIEW);
    renderHud();
    renderTitle();
  }
}
window.claude?.hot?.snapshot?.(() => ({ st }));
if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
else boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
