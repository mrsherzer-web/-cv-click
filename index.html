<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SmartPantry · מה אוכלים בבית?</title>
  <meta name="description" content="מצלמים את המקרר, ה-AI מזהה מה יש, ומקבלים 3-4 מתכונים של 15 דקות רק ממה שיש בבית." />
  <meta name="theme-color" content="#0f9d58" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view" aria-live="polite"></main>

    <nav id="tabbar" class="tabbar" aria-label="ניווט ראשי" hidden>
      <button class="tab" data-route="home" aria-label="בית">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>בית</span>
      </button>
      <button class="tab" data-route="pantry" aria-label="המקרר שלי">
        <svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 7v11h12V9zm0-2h12V4H6zm2-2h2v1H8zm0 6h2v3H8z"/></svg>
        <span>המקרר</span>
      </button>
      <button class="tab tab-scan" data-route="scan" aria-label="סריקה">
        <span class="scan-fab">
          <svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
        </span>
      </button>
      <button class="tab" data-route="recipes" aria-label="מתכונים">
        <svg viewBox="0 0 24 24"><path d="M11 2v7a2 2 0 0 1-2 2v11H7V11a2 2 0 0 1-2-2V2h1.5v6h1V2h1.5v6h1V2zm7 0c1.7 0 3 2.2 3 6v4h-2v10h-2V2z"/></svg>
        <span>מתכונים</span>
      </button>
      <button class="tab" data-route="profile" aria-label="פרופיל">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg>
        <span>פרופיל</span>
      </button>
    </nav>

    <div id="sheet-root"></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
