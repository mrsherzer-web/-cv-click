<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<title>חדר הדמויות</title>
<style>
/* HUD for a full-screen 3D game on a phone. Translucent dark panels over the scene, one amber accent
   (late-afternoon sun over the hills), controls sized for thumbs and kept clear of the notch. */
:root {
  --panel: rgba(12, 15, 22, .62);
  --panel-strong: rgba(12, 15, 22, .86);
  --line: rgba(255, 255, 255, .14);
  --ink: #f4f1ea;
  --ink-2: #b9b4a8;
  --accent: #ffb547;
  --accent-ink: #2b1a00;
  --ok: #7bd88f;
  --f-ui: system-ui, -apple-system, "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #11151c; overscroll-behavior: none; }
body {
  position: fixed; inset: 0;
  color: var(--ink);
  font: 500 15px/1.4 var(--f-ui);
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#game { position: fixed; inset: 0; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: absolute; inset: 0; pointer-events: none; }
.hud button { pointer-events: auto; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

/* top bar: objective at the start (right) edge, pause at the end (left) edge */
.topbar {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));
}
.objective { max-width: min(62vw, 360px); padding: 8px 12px 9px; }
.obj-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
.obj-text { font-size: 15px; font-weight: 600; line-height: 1.35; }
.obj-dist { margin-top: 3px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.obj-arrow {
  width: 16px; height: 16px; flex: none;
  background: var(--accent);
  clip-path: polygon(50% 0, 100% 100%, 50% 74%, 0 100%);
  transition: transform .12s linear;
}
.round-btn {
  width: 46px; height: 46px; flex: none;
  border-radius: 50%; border: 1px solid var(--line);
  background: var(--panel);
  display: grid; place-items: center; cursor: pointer;
}
.round-btn svg { width: 22px; height: 22px; fill: var(--ink); }

.toast {
  position: absolute; top: calc(70px + var(--safe-t)); left: 0; right: 0; margin-inline: auto;
  width: max-content; max-width: calc(100% - 32px);
  padding: 9px 16px; border-radius: 12px;
  background: var(--panel-strong); border: 1px solid var(--line);
  font-weight: 600; text-align: center;
  opacity: 0; transform: translateY(-8px);
  transition: opacity .25s, transform .25s;
}
.toast.show { opacity: 1; transform: none; }
.caption {
  position: absolute; left: 0; right: 0; margin-inline: auto;
  bottom: calc(26px + var(--safe-b));
  width: max-content; max-width: min(80vw, 560px);
  padding: 10px 16px; border-radius: 12px;
  background: var(--panel-strong); border: 1px solid var(--line);
  font-size: 16px; font-weight: 600; text-align: center; line-height: 1.45;
}

/* floating joystick: rests at the lower left, jumps to wherever the left thumb lands */
.stick {
  position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px;
  left: calc(96px + var(--safe-l)); top: calc(100% - 104px - var(--safe-b));
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .28);
  background: radial-gradient(circle, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03) 70%);
  opacity: .55; transition: opacity .15s;
}
.stick.active { opacity: 1; }
.stick-knob {
  position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
  border-radius: 50%;
  background: rgba(244, 241, 234, .9);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
}

.actions {
  position: absolute;
  right: calc(18px + var(--safe-r)); bottom: calc(18px + var(--safe-b));
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.act {
  width: 74px; height: 74px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .3);
  background: var(--panel);
  display: grid; place-items: center; align-content: center; gap: 1px;
  cursor: pointer;
}
.act svg { width: 28px; height: 28px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.act-run svg circle { fill: var(--ink); stroke: none; }
.act-label { font-size: 11px; font-weight: 700; }
.act[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.act[aria-pressed="true"] svg { stroke: var(--accent-ink); }
.act[aria-pressed="true"] svg circle { fill: var(--accent-ink); }
.act-interact { width: 84px; height: 84px; border-color: var(--accent); }
.act:active { transform: scale(.95); }

/* top left: pause and money in a row, the minimap under them */
.topleft { display: grid; gap: 8px; justify-items: start; }
.topleft-row { display: flex; align-items: center; gap: 8px; direction: ltr; }
.money { padding: 6px 12px; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 16px; direction: rtl; transition: background .3s; }
.money.flash { background: rgba(123, 216, 143, .45); }
.minimap {
  width: 110px; height: 110px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .25); background: rgba(12, 15, 22, .5);
  pointer-events: none;
}
@media (max-height: 420px) { .minimap { width: 92px; height: 92px; } }

/* a mission starting or done: a short title card in the middle */
.banner {
  position: absolute; left: 0; right: 0; top: 26%; margin-inline: auto;
  width: max-content; max-width: calc(100% - 40px); padding: 12px 22px 14px;
  text-align: center; border-radius: 16px;
  background: var(--panel-strong); border: 1px solid var(--line);
  animation: banner-in .35s ease-out;
}
.banner-kicker { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .03em; }
.banner-title { font-size: 26px; font-weight: 800; line-height: 1.2; }
.banner-sub { font-size: 14px; color: var(--ink-2); margin-top: 4px; white-space: pre-line; }
.banner-sub:empty { display: none; }
@keyframes banner-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .banner { animation: none; } }

.caption { pointer-events: auto; }

.missions { display: grid; gap: 8px; }
.mission-rows { display: grid; gap: 6px; }
.mission-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; padding: 6px 10px; border-radius: 10px; background: rgba(255, 255, 255, .05); }
.mission-row .name { font-weight: 700; }
.mission-row .status { min-width: 0; display: flex; align-items: center; gap: 6px; }
.mission-row .done { color: var(--ok); font-size: 12px; }
.mission-row .note { font-size: 12px; color: var(--ink-2); line-height: 1.35; }
.mission-row.now, .mission-row.next { background: rgba(108, 182, 255, .14); }
.mission-row.now .note, .mission-row.next .note { color: var(--ink); }
.mission-row.locked { opacity: .62; }
.mission-row button { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); font-weight: 700; cursor: pointer; }

/* driving: speed and the car's condition, then the pedals under the right thumb */
.carhud {
  position: absolute; right: calc(18px + var(--safe-r)); bottom: calc(196px + var(--safe-b));
  min-width: 112px; padding: 6px 12px 8px; display: grid; gap: 5px;
}
.speed { display: flex; align-items: baseline; gap: 6px; justify-content: center; font-variant-numeric: tabular-nums; }
.speed span { font-size: 26px; font-weight: 800; }
.speed small { font-size: 12px; color: var(--ink-2); }
.meter { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .14); overflow: hidden; }
.meter-fill { height: 100%; width: 100%; background: var(--ok); transform-origin: right; transition: width .3s; }
.meter-fill.low { background: #e8a33a; }
.meter-fill.bad { background: #e2574c; }
.pedals {
  position: absolute; right: calc(14px + var(--safe-r)); bottom: calc(14px + var(--safe-b));
  display: grid; gap: 10px; justify-items: end;
}
.pedal-row { display: flex; gap: 10px; align-items: flex-end; }
.act-small { width: 60px; height: 60px; }
.act-small svg { width: 22px; height: 22px; }
.pedal {
  width: 82px; height: 112px; border-radius: 22px;
  border: 2px solid rgba(255, 255, 255, .3); background: var(--panel);
  display: grid; place-items: center; align-content: center; gap: 2px;
  font-weight: 800; font-size: 17px; cursor: pointer; touch-action: none;
}
.pedal small { font-size: 11px; font-weight: 700; color: var(--ink-2); }
.pedal-gas { height: 132px; border-color: rgba(123, 216, 143, .55); }
.pedal[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pedal[aria-pressed="true"] small { color: var(--accent-ink); }
@media (max-height: 420px) {
  .pedal { width: 74px; height: 96px; }
  .pedal-gas { height: 112px; }
  .act-small { width: 54px; height: 54px; }
  .carhud { bottom: calc(176px + var(--safe-b)); }
}

/* start screen and pause menu */
.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding: calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));
  background: linear-gradient(180deg, rgba(10, 13, 19, .35), rgba(10, 13, 19, .82));
  overflow-y: auto; touch-action: pan-y;
}
.sheet {
  width: min(100%, 440px);
  padding: 20px 20px 16px;
  border-radius: 20px;
  background: var(--panel-strong); border: 1px solid var(--line);
  display: grid; gap: 12px;
}
.eyebrow { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .03em; }
.sheet h1 { margin: 0; font-size: clamp(26px, 6vw, 34px); line-height: 1.1; font-weight: 800; }
.sheet h2 { margin: 0; font-size: 22px; font-weight: 800; }
.lead { margin: 0; color: var(--ink-2); line-height: 1.55; }
.howto { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
.howto b { color: var(--ink); }
.primary, .secondary {
  min-height: 50px; border-radius: 14px; cursor: pointer;
  font-size: 17px; font-weight: 700;
}
.primary { border: 0; background: var(--accent); color: var(--accent-ink); }
.primary:disabled { opacity: .55; cursor: default; }
.secondary { border: 1px solid var(--line); background: rgba(255, 255, 255, .06); }
.linkbtn { display: grid; place-items: center; color: var(--ink); text-decoration: none; }
.fineprint { margin: 0; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.setting-name { font-weight: 600; }
.segmented { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); }
.segmented button { min-width: 74px; min-height: 40px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; font-weight: 600; }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.rotate-hint {
  position: absolute; left: 0; right: 0; margin-inline: auto;
  top: calc(118px + var(--safe-t));
  animation: hint-out 8s forwards;
  width: max-content; padding: 6px 12px; border-radius: 99px;
  background: var(--panel); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-2); pointer-events: none;
}
@keyframes hint-out { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
@media (orientation: landscape) { .rotate-hint { display: none; } }
@media (orientation: portrait) { .toast { top: calc(150px + var(--safe-t)); } }
@media (max-height: 420px) {
  .act { width: 64px; height: 64px; }
  .act-interact { width: 74px; height: 74px; }
  .actions { gap: 10px; }
}

/* health and stamina under the money; stamina flashes when a move was too much */
.vitals { width: 110px; padding: 6px 8px; display: grid; gap: 5px; direction: ltr; }
.vital { display: flex; align-items: center; gap: 6px; }
.vital svg { width: 13px; height: 13px; flex: none; fill: var(--ink-2); }
.vital .meter { flex: 1; }
.meter-fill.hp { background: #7bd88f; }
.meter-fill.hp.low { background: #e8a33a; }
.meter-fill.hp.bad { background: #e2574c; }
.meter-fill.st { background: #f2c230; transition: width .12s; }
.vitals.tired .meter-fill.st { background: #ff7a45; }
.vitals.tired #staminaRow { animation: tired .3s ease-in-out 2; }
@keyframes tired { 50% { transform: translateX(-3px); } }
@media (max-height: 420px) { .vitals { width: 92px; padding: 5px 7px; } }

/* fist-fight buttons under the right thumb: punch in the corner, block beside it, dodge above */
.combat {
  position: absolute; right: calc(14px + var(--safe-r)); bottom: calc(14px + var(--safe-b));
  width: 186px; height: 172px;
}
.combat .act { position: absolute; touch-action: none; }
.act-punch { right: 0; bottom: 0; width: 90px; height: 90px; border-color: rgba(226, 87, 76, .8); }
.act-punch svg { width: 32px; height: 32px; }
.act-block { right: 100px; bottom: 4px; width: 70px; height: 70px; border-color: rgba(108, 182, 255, .7); }
.act-dodge { right: 12px; bottom: 102px; width: 66px; height: 66px; border-color: rgba(123, 216, 143, .7); }
.act-dodge .act-label, .act-block .act-label { font-size: 10px; }
.act-block[aria-pressed="true"] { background: #6cb6ff; border-color: #6cb6ff; color: #04182c; }
.act-block[aria-pressed="true"] svg { stroke: #04182c; }
.hud.combat-on .actions { bottom: calc(196px + var(--safe-b)); }
.hud.combat-on .act-run { display: none; }
.hud.combat-on .caption { left: 0; right: calc(210px + var(--safe-r)); max-width: min(64vw, 470px); }
@media (max-height: 420px) {
  .combat { width: 170px; height: 156px; }
  .act-punch { width: 80px; height: 80px; }
  .act-block { right: 90px; width: 62px; height: 62px; }
  .act-dodge { right: 10px; bottom: 90px; width: 60px; height: 60px; }
  .hud.combat-on .actions { bottom: calc(166px + var(--safe-b)); }
}

/* a punch landing on Nehorai: the screen edges darken for a moment */
.hurt {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  box-shadow: inset 0 0 90px 30px rgba(40, 10, 10, .75);
  transition: opacity .45s ease-out;
}
.hurt.on { opacity: 1; transition: none; }

/* a word over the action: blocked, dodged, counter */
.pop {
  position: absolute; left: 0; right: 0; top: 34%; margin-inline: auto; width: max-content;
  font-size: 22px; font-weight: 800; letter-spacing: .02em; pointer-events: none;
  text-shadow: 0 2px 8px rgba(0, 0, 0, .7); opacity: 0;
}
.pop.show { animation: pop-up .7s ease-out; }
.pop.block { color: #8cc8ff; }
.pop.dodge { color: #9be6aa; }
.pop.counter { color: #ffd23f; }
.pop.hit { color: #f4f1ea; }
@keyframes pop-up { 0% { opacity: 0; transform: translateY(8px) scale(.9); } 20% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-18px); } }
@media (prefers-reduced-motion: reduce) { .pop.show { animation-duration: .01s; opacity: 1; } }

/* opponents' names and health, floating over their heads */
.enemy-bars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.enemy-bar {
  position: absolute; left: 0; top: 0; width: 84px; margin-left: -42px; margin-top: -26px;
  display: grid; gap: 3px; justify-items: center; will-change: transform;
}
.enemy-bar .name { font-size: 12px; font-weight: 800; text-shadow: 0 1px 4px rgba(0, 0, 0, .8); }
.enemy-bar .meter { width: 100%; height: 5px; background: rgba(0, 0, 0, .45); }
.enemy-bar .meter-fill { background: #e2574c; transition: width .2s; }
.enemy-bar.open .meter-fill { background: #ffd23f; }

/* cutscenes: only the conversation, the objective, a scene's own button and pause stay */
.hud.cinematic .stick, .hud.cinematic .act-run, .hud.cinematic .combat, .hud.cinematic .vitals,
.hud.cinematic .minimap, .hud.cinematic .pedals, .hud.cinematic .carhud, .hud.cinematic .enemy-bars { visibility: hidden; }

/* an incoming call: who is calling and one button to answer */
.call {
  position: absolute; left: 0; right: 0; margin-inline: auto; top: calc(86px + var(--safe-t));
  width: max-content; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px;
  animation: banner-in .3s ease-out; pointer-events: auto;
}
.call-who { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.call-ring { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); animation: ring 1s ease-in-out infinite; }
@keyframes ring { 50% { transform: scale(1.5); opacity: .5; } }
.call-answer { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #2f9e5a; color: #fff; font-weight: 800; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .call-ring { animation: none; } }

/* the phone: a button by the money once there is someone to call, and a list of friends */
.phone-btn { position: relative; }
.phone-btn svg { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.phone-btn svg .screen { fill: rgba(255, 255, 255, .25); stroke: none; }
.phone-btn svg .dot { fill: var(--ink); stroke: none; }
.badge { position: absolute; top: 3px; right: 3px; width: 11px; height: 11px; border-radius: 50%; background: #e2574c; border: 2px solid var(--panel-strong); animation: ring 1s ease-in-out infinite; }
.phone-sheet { width: min(100%, 380px); }
.contacts { display: grid; gap: 8px; }
.contact { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, .05); }
.contact-name { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.contact-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.contact small { color: var(--ink-2); font-weight: 500; }
.contact button { min-height: 42px; padding: 0 14px; border: 0; border-radius: 10px; background: #2f9e5a; color: #fff; font-weight: 800; cursor: pointer; }
.contact button.wanted { box-shadow: 0 0 0 3px rgba(255, 181, 71, .7); }

/* the alert: an eye and a bar, amber while they look around, red during a chase */
.alert { width: 110px; padding: 5px 8px; display: flex; align-items: center; gap: 6px; direction: ltr; }
.alert svg { width: 16px; height: 16px; flex: none; fill: none; stroke: #ffb547; stroke-width: 1.8; }
.alert-body { flex: 1; display: grid; gap: 3px; direction: rtl; }
.alert-label { font-size: 10px; font-weight: 700; color: var(--ink-2); line-height: 1.1; }
.alert .meter-fill { background: #ffb547; transition: width .3s; }
.alert.chase svg { stroke: #e2574c; animation: ring .8s ease-in-out infinite; }
.alert.chase .meter-fill { background: #e2574c; }
.alert.chase .alert-label { color: #ff9180; }
@media (max-height: 420px) { .alert { width: 92px; } }

/* the garage: repair, paint and upgrades, each with its price */
.garage-sheet { width: min(100%, 460px); }
.garage-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, .05); }
.garage-part { display: grid; gap: 8px; }
.buy { min-height: 42px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 800; cursor: pointer; white-space: nowrap; }
.buy:disabled { background: rgba(255, 255, 255, .12); color: var(--ink-2); cursor: default; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; position: relative; }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 181, 71, .35); }
.swatch:disabled { opacity: .45; cursor: default; }
.upgrades { display: grid; gap: 6px; }
.upgrade { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 10px; background: rgba(255, 255, 255, .05); }
.upgrade small { display: block; color: var(--ink-2); font-size: 12px; }
.owned { color: var(--ok); font-weight: 700; font-size: 13px; }

/* sound on and off */
.mute-btn svg { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; }
.mute-btn svg .cone { fill: var(--ink); stroke: none; }
.mute-btn svg .cross { display: none; }
.mute-btn[aria-pressed="true"] svg .waves { display: none; }
.mute-btn[aria-pressed="true"] svg .cross { display: inline; }
@media (max-height: 420px) { .topleft-row .round-btn { width: 42px; height: 42px; } }

/* starting over is the one button that deletes something: it says so */
.secondary.danger { color: #ff9180; border-color: rgba(226, 87, 76, .45); }
.primary.danger-solid { background: #e2574c; color: #fff; }
</style>
<style>
/* Character room: the 3D stage fills the screen; title on top, the selected character's card,
   and a row of names with the movement toggle at the bottom. */
.cv-top {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: calc(12px + var(--safe-t)) calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l));
  pointer-events: none;
}
.cv-title { margin: 2px 0 0; font-size: 22px; font-weight: 800; }
.cv-link {
  pointer-events: auto;
  padding: 9px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line);
  color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px;
}
.cv-card {
  position: absolute;
  top: calc(70px + var(--safe-t)); right: calc(14px + var(--safe-r));
  width: min(300px, calc(100% - 28px));
  padding: 10px 14px;
}
.cv-name { font-size: 18px; font-weight: 800; color: var(--accent); }
.cv-look { margin: 4px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.cv-controls {
  position: absolute; left: 0; right: 0;
  bottom: calc(34px + var(--safe-b));
  display: grid; justify-items: center; gap: 10px;
  padding-left: max(14px, var(--safe-l)); padding-right: max(14px, var(--safe-r));
}
.cv-cast { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 760px; }
.cv-cast button {
  min-height: 40px; padding: 0 14px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--panel);
  font-weight: 700; font-size: 14px; cursor: pointer;
}
.cv-cast button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cv-note {
  position: absolute; left: 0; right: 0; bottom: calc(8px + var(--safe-b));
  margin: 0; text-align: center; font-size: 11px; color: var(--ink-2);
  padding-inline: 14px;
}
.cv-controls .cv-zoom {
  min-height: 40px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer;
}
.cv-zoom[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* short landscape screens (a phone on its side): the buttons move into a column on the left,
   so the character gets the full height in the middle */
@media (orientation: landscape) and (max-height: 500px) {
  .cv-controls {
    top: calc(62px + var(--safe-t)); bottom: auto;
    left: calc(14px + var(--safe-l)); right: auto;
    width: 248px; padding: 0; justify-items: stretch;
  }
  .cv-cast { justify-content: flex-start; }
  .cv-controls .segmented { display: flex; }
  .cv-controls .segmented button { flex: 1; min-width: 0; }
  .cv-card { top: calc(62px + var(--safe-t)); }
}
</style>
</head>
<body>
<div id="game">
  <canvas id="view"></canvas>
  <header class="cv-top">
    <div>
      <div class="eyebrow">חייו של נהוראי פרחי</div>
      <h1 class="cv-title">חדר הדמויות</h1>
    </div>
    <a class="cv-link" href="play.html" id="playLink">למשחק</a>
  </header>
  <section class="cv-card panel" id="card" aria-live="polite">
    <div class="cv-name" id="cvName"></div>
    <p class="cv-look" id="cvLook"></p>
  </section>
  <nav class="cv-controls">
    <div class="cv-cast" id="cast" role="group" aria-label="בחירת דמות"></div>
    <div class="segmented" role="group" aria-label="תנועה">
      <button type="button" data-move="0" aria-pressed="true">עמידה</button>
      <button type="button" data-move="2.4" aria-pressed="false">הליכה</button>
      <button type="button" data-move="6.2" aria-pressed="false">ריצה</button>
    </div>
    <button class="cv-zoom" type="button" id="zoomBtn" aria-pressed="false">תקריב לפנים</button>
  </nav>
  <p class="cv-note">גוררים כדי לסובב. המראה מבוסס על התמונות ששלחתם; הדפסים ולוגואים הם מקוריים. כל הדמויות בדיוניות.</p>
</div>
