<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<title>חדר הדמויות</title>
<style>
/* HUD for a full-screen 3D game on a phone. Translucent dark panels over the scene, one amber accent
   (late-afternoon sun over the hills), controls sized for thumbs and kept clear of the notch. */
:root {
  --panel: rgba(12, 15, 22, .62);
  --panel-strong: rgba(12, 15, 22, .86);
  --line: rgba(255, 255, 255, .14);
  --ink: #f4f1ea;
  --ink-2: #b9b4a8;
  --accent: #ffb547;
  --accent-ink: #2b1a00;
  --ok: #7bd88f;
  --f-ui: system-ui, -apple-system, "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #11151c; overscroll-behavior: none; }
body {
  position: fixed; inset: 0;
  color: var(--ink);
  font: 500 15px/1.4 var(--f-ui);
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#game { position: fixed; inset: 0; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: absolute; inset: 0; pointer-events: none; }
.hud button { pointer-events: auto; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

/* top bar: objective at the start (right) edge, pause at the end (left) edge */
.topbar {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));
}
.objective { max-width: min(62vw, 360px); padding: 8px 12px 9px; }
.obj-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
.obj-text { font-size: 15px; font-weight: 600; line-height: 1.35; }
.obj-dist { margin-top: 3px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.obj-arrow {
  width: 16px; height: 16px; flex: none;
  background: var(--accent);
  clip-path: polygon(50% 0, 100% 100%, 50% 74%, 0 100%);
  transition: transform .12s linear;
}
.round-btn {
  width: 46px; height: 46px; flex: none;
  border-radius: 50%; border: 1px solid var(--line);
  background: var(--panel);
  display: grid; place-items: center; cursor: pointer;
}
.round-btn svg { width: 22px; height: 22px; fill: var(--ink); }

.toast {
  position: absolute; top: calc(70px + var(--safe-t)); left: 0; right: 0; margin-inline: auto;
  width: max-content; max-width: calc(100% - 32px);
  padding: 9px 16px; border-radius: 12px;
  background: var(--panel-strong); border: 1px solid var(--line);
  font-weight: 600; text-align: center;
  opacity: 0; transform: translateY(-8px);
  transition: opacity .25s, transform .25s;
}
.toast.show { opacity: 1; transform: none; }
.caption {
  position: absolute; left: 0; right: 0; margin-inline: auto;
  bottom: calc(26px + var(--safe-b));
  width: max-content; max-width: min(80vw, 560px);
  padding: 10px 16px; border-radius: 12px;
  background: var(--panel-strong); border: 1px solid var(--line);
  font-size: 16px; font-weight: 600; text-align: center; line-height: 1.45;
}

/* floating joystick: rests at the lower left, jumps to wherever the left thumb lands */
.stick {
  position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px;
  left: calc(96px + var(--safe-l)); top: calc(100% - 104px - var(--safe-b));
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .28);
  background: radial-gradient(circle, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03) 70%);
  opacity: .55; transition: opacity .15s;
}
.stick.active { opacity: 1; }
.stick-knob {
  position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
  border-radius: 50%;
  background: rgba(244, 241, 234, .9);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
}

.actions {
  position: absolute;
  right: calc(18px + var(--safe-r)); bottom: calc(18px + var(--safe-b));
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.act {
  width: 74px; height: 74px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .3);
  background: var(--panel);
  display: grid; place-items: center; align-content: center; gap: 1px;
  cursor: pointer;
}
.act svg { width: 28px; height: 28px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.act-run svg circle { fill: var(--ink); stroke: none; }
.act-label { font-size: 11px; font-weight: 700; }
.act[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.act[aria-pressed="true"] svg { stroke: var(--accent-ink); }
.act[aria-pressed="true"] svg circle { fill: var(--accent-ink); }
.act-interact { width: 84px; height: 84px; border-color: var(--accent); }
.act:active { transform: scale(.95); }

/* start screen and pause menu */
.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding: calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));
  background: linear-gradient(180deg, rgba(10, 13, 19, .35), rgba(10, 13, 19, .82));
  overflow-y: auto; touch-action: pan-y;
}
.sheet {
  width: min(100%, 440px);
  padding: 20px 20px 16px;
  border-radius: 20px;
  background: var(--panel-strong); border: 1px solid var(--line);
  display: grid; gap: 12px;
}
.eyebrow { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .03em; }
.sheet h1 { margin: 0; font-size: clamp(26px, 6vw, 34px); line-height: 1.1; font-weight: 800; }
.sheet h2 { margin: 0; font-size: 22px; font-weight: 800; }
.lead { margin: 0; color: var(--ink-2); line-height: 1.55; }
.howto { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
.howto b { color: var(--ink); }
.primary, .secondary {
  min-height: 50px; border-radius: 14px; cursor: pointer;
  font-size: 17px; font-weight: 700;
}
.primary { border: 0; background: var(--accent); color: var(--accent-ink); }
.primary:disabled { opacity: .55; cursor: default; }
.secondary { border: 1px solid var(--line); background: rgba(255, 255, 255, .06); }
.linkbtn { display: grid; place-items: center; color: var(--ink); text-decoration: none; }
.fineprint { margin: 0; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.setting-name { font-weight: 600; }
.segmented { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); }
.segmented button { min-width: 74px; min-height: 40px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; font-weight: 600; }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.rotate-hint {
  position: absolute; left: 0; right: 0; margin-inline: auto;
  top: calc(118px + var(--safe-t));
  animation: hint-out 8s forwards;
  width: max-content; padding: 6px 12px; border-radius: 99px;
  background: var(--panel); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-2); pointer-events: none;
}
@keyframes hint-out { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
@media (orientation: landscape) { .rotate-hint { display: none; } }
@media (orientation: portrait) { .toast { top: calc(150px + var(--safe-t)); } }
@media (max-height: 420px) {
  .act { width: 64px; height: 64px; }
  .act-interact { width: 74px; height: 74px; }
  .actions { gap: 10px; }
}
</style>
<style>
/* Character room: the 3D stage fills the screen; title on top, the selected character's card,
   and a row of names with the movement toggle at the bottom. */
.cv-top {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: calc(12px + var(--safe-t)) calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l));
  pointer-events: none;
}
.cv-title { margin: 2px 0 0; font-size: 22px; font-weight: 800; }
.cv-link {
  pointer-events: auto;
  padding: 9px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line);
  color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px;
}
.cv-card {
  position: absolute;
  top: calc(70px + var(--safe-t)); right: calc(14px + var(--safe-r));
  width: min(300px, calc(100% - 28px));
  padding: 10px 14px;
}
.cv-name { font-size: 18px; font-weight: 800; color: var(--accent); }
.cv-look { margin: 4px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.cv-controls {
  position: absolute; left: 0; right: 0;
  bottom: calc(34px + var(--safe-b));
  display: grid; justify-items: center; gap: 10px;
  padding-left: max(14px, var(--safe-l)); padding-right: max(14px, var(--safe-r));
}
.cv-cast { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 760px; }
.cv-cast button {
  min-height: 40px; padding: 0 14px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--panel);
  font-weight: 700; font-size: 14px; cursor: pointer;
}
.cv-cast button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cv-note {
  position: absolute; left: 0; right: 0; bottom: calc(8px + var(--safe-b));
  margin: 0; text-align: center; font-size: 11px; color: var(--ink-2);
  padding-inline: 14px;
}
.cv-controls .cv-zoom {
  min-height: 40px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer;
}
.cv-zoom[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* short landscape screens (a phone on its side): the buttons move into a column on the left,
   so the character gets the full height in the middle */
@media (orientation: landscape) and (max-height: 500px) {
  .cv-controls {
    top: calc(62px + var(--safe-t)); bottom: auto;
    left: calc(14px + var(--safe-l)); right: auto;
    width: 248px; padding: 0; justify-items: stretch;
  }
  .cv-cast { justify-content: flex-start; }
  .cv-controls .segmented { display: flex; }
  .cv-controls .segmented button { flex: 1; min-width: 0; }
  .cv-card { top: calc(62px + var(--safe-t)); }
}
</style>
</head>
<body>
<div id="game">
  <canvas id="view"></canvas>
  <header class="cv-top">
    <div>
      <div class="eyebrow">חייו של נהוראי פרחי</div>
      <h1 class="cv-title">חדר הדמויות</h1>
    </div>
    <a class="cv-link" href="play.html" id="playLink">למשחק</a>
  </header>
  <section class="cv-card panel" id="card" aria-live="polite">
    <div class="cv-name" id="cvName"></div>
    <p class="cv-look" id="cvLook"></p>
  </section>
  <nav class="cv-controls">
    <div class="cv-cast" id="cast" role="group" aria-label="בחירת דמות"></div>
    <div class="segmented" role="group" aria-label="תנועה">
      <button type="button" data-move="0" aria-pressed="true">עמידה</button>
      <button type="button" data-move="2.4" aria-pressed="false">הליכה</button>
      <button type="button" data-move="6.2" aria-pressed="false">ריצה</button>
    </div>
    <button class="cv-zoom" type="button" id="zoomBtn" aria-pressed="false">תקריב לפנים</button>
  </nav>
  <p class="cv-note">גוררים כדי לסובב. המראה מבוסס על התמונות ששלחתם; הדפסים ולוגואים הם מקוריים. כל הדמויות בדיוניות.</p>
</div>
