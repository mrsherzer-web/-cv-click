<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="local.css">
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
.layer{position:absolute;inset:0;display:none}.on{display:block}
.card{position:absolute;right:110px;top:190px;width:700px;border-radius:30px;padding:24px 28px 26px;
  background:rgba(28,30,34,.88);box-shadow:0 18px 50px rgba(0,0,0,.45);font-family:'Heebo';color:#fff}
.hdr{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.av{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#4aa3ff,#2563eb);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px}
.name{font-weight:800;font-size:34px}
.time{margin-right:auto;font-weight:300;font-size:24px;color:#b9bec7}
.app{font-weight:400;font-size:22px;color:#b9bec7;letter-spacing:1px}
.bubble{display:inline-block;max-width:600px;background:#2d6cdf;border-radius:26px 26px 26px 8px;padding:16px 24px;font-weight:500;font-size:38px;line-height:1.3}
.b2{position:absolute;right:110px;top:470px;width:700px;display:flex;justify-content:flex-start}
.b2 .bubble{background:#e23b3b;font-weight:800;font-size:56px;padding:14px 34px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
</style></head><body>
<div class="layer" id="msg1"><div class="card">
 <div class="hdr"><div class="av">י</div><div><div class="name">יהלי</div><div class="app">הודעה חדשה</div></div><div class="time">עכשיו</div></div>
 <div class="bubble">רפאל מחפשים אותך אחי וזה אנשים לא טובים!!!!!</div>
</div></div>
<div class="layer" id="msg2"><div class="b2"><div class="bubble">תברח !</div></div></div>
</body></html>
