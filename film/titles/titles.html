<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="local.css">
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
.layer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
.on{display:flex}
.gold{background:linear-gradient(180deg,#fff6d8 0%,#f3d58a 22%,#c9973f 48%,#8a5a1c 52%,#d8a955 70%,#fbe7a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.studio{font-family:'Frank Ruhl Libre';font-weight:900;font-size:168px;line-height:1;letter-spacing:2px;filter:drop-shadow(0 2px 0 rgba(60,30,0,.9)) drop-shadow(0 0 18px rgba(255,170,60,.25))}
.presents{font-family:'Heebo';font-weight:300;font-size:46px;letter-spacing:22px;color:#e9dcc0;margin-right:-22px}
.line{width:520px;height:2px;background:linear-gradient(90deg,transparent,#d9b36a,transparent)}
.credit-small{font-family:"Heebo";font-weight:400;font-size:38px;letter-spacing:12px;color:#d8cdb8;margin-bottom:10px}
.credit-name{font-family:"Frank Ruhl Libre";font-weight:500;font-size:112px;color:#f4ecdc;letter-spacing:4px;line-height:1.05}
.title{font-family:'Suez One';font-size:250px;line-height:1;letter-spacing:4px;
 background:linear-gradient(180deg,#ffffff 0%,#e6ebf0 30%,#9aa6b2 50%,#4b5560 52%,#c7cfd6 75%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(255,120,30,.55))}
.titleglow{font-family:'Suez One';font-size:250px;line-height:1;letter-spacing:4px;color:#ff8a2a;filter:blur(14px)}
.tag{position:absolute;top:735px;display:flex;flex-direction:column;align-items:flex-start;direction:rtl}
.tagname{font-family:'Heebo';font-weight:800;font-size:64px;color:#fff;letter-spacing:3px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.tagbar{width:150px;height:5px;background:#ff7a1a;margin:12px 0 10px;box-shadow:0 0 12px rgba(255,120,30,.8)}
.tagsub{font-family:'Heebo';font-weight:300;font-size:26px;color:#e8e2d6;letter-spacing:6px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.credit-name.gold{color:transparent}
.star{font-weight:900;font-size:128px;filter:drop-shadow(0 2px 0 rgba(60,30,0,.9)) drop-shadow(0 0 16px rgba(255,170,60,.3))}
.past{font-family:'David Libre';font-weight:400;font-size:92px;color:#f3e6c8;letter-spacing:3px;text-shadow:0 0 18px rgba(0,0,0,.6)}
</style></head><body>
<div class="layer" id="emblem">
<svg width="300" height="300" viewBox="0 0 300 300" style="margin-top:-330px">
 <defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3cf"/><stop offset=".45" stop-color="#d6a64e"/><stop offset=".55" stop-color="#8d5d1f"/><stop offset="1" stop-color="#f1d28b"/></linearGradient>
  <radialGradient id="b" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#5a5f66"/><stop offset=".5" stop-color="#1c1f24"/><stop offset="1" stop-color="#050607"/></radialGradient>
  <radialGradient id="s" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffd27a"/><stop offset="1" stop-color="rgba(255,120,20,0)"/></radialGradient>
 </defs>
 <circle cx="150" cy="150" r="138" fill="none" stroke="url(#g)" stroke-width="6"/>
 <circle cx="150" cy="150" r="124" fill="none" stroke="url(#g)" stroke-width="1.5" opacity=".7"/>
 <circle cx="142" cy="170" r="70" fill="url(#b)" stroke="url(#g)" stroke-width="4"/>
 <path d="M112 140 A44 44 0 0 1 150 112" stroke="rgba(255,255,255,.35)" stroke-width="7" fill="none" stroke-linecap="round"/>
 <rect x="160" y="92" width="34" height="26" rx="4" transform="rotate(40 177 105)" fill="url(#g)"/>
 <path d="M186 88 C 196 66, 214 70, 214 56" stroke="url(#g)" stroke-width="5" fill="none" stroke-linecap="round"/>
 <circle cx="216" cy="50" r="26" fill="url(#s)"/>
 <path d="M216 30 L220 46 L236 50 L220 54 L216 70 L212 54 L196 50 L212 46 Z" fill="#fff8e0"/>
</svg></div>
<div class="layer" id="studio"><div class="studio gold" style="margin-top:250px">רפאל פצצות</div></div>
<div class="layer" id="presents"><div style="margin-top:620px;display:flex;flex-direction:column;align-items:center;gap:26px"><div class="line"></div><div class="presents">מציגים</div></div></div>
<div class="layer" id="credit1"><div style="position:absolute;right:170px;top:640px;display:flex;flex-direction:column;align-items:center"><div class="credit-small">בכיכובו של</div><div class="credit-name gold star">רפאל</div></div></div>
<div class="layer" id="credit2"><div style="position:absolute;left:170px;top:640px;display:flex;flex-direction:column;align-items:center"><div class="credit-small">ובכיכובם של</div><div class="credit-name">המטומטמים</div></div></div>
<div class="layer" id="title"><div class="title">הסרט הגדול</div></div>
<div class="layer" id="titleglow"><div class="titleglow">הסרט הגדול</div></div>
<div class="layer" id="tagR"><div class="tag" style="left:150px"><div class="tagname">רפאל</div><div class="tagbar"></div></div></div>
<div class="layer" id="tagY"><div class="tag" style="right:150px"><div class="tagname">יהלי</div><div class="tagbar"></div></div></div>
<div class="layer" id="past"><div class="past">לפני כמה שנים...</div></div>
</body></html>
